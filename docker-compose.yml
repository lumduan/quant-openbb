services:
  quant-openbb:
    container_name: quant-openbb
    image: quant-openbb:latest
    build:
      context: .
    ports:
      - "8500:8000"
    env_file: .env
    environment:
      - OPENBB_DEV_MODE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - quant-network

networks:
  quant-network:
    external: true
